name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build DMG (ad-hoc signed)
        run: SIGN_IDENTITY=- ./build-dmg.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LidUpAnimation-dmg-adhoc
          path: dist/*
